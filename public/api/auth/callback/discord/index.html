<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Autenticando con Discord...</title>
  <style>
    body {
      background-color: #0c0e18;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(255,255,255,0.1);
      border-top-color: #5865F2;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <h3>Conectando con Discord...</h3>
  <p style="font-size: 13px; color: #949ba4;">Completando inicio de sesión seguro en PE:RP...</p>

  <script>
    (function() {
      // Check for token in hash or query
      const hash = window.location.hash.substring(1);
      const hashParams = new URLSearchParams(hash);
      const searchParams = new URLSearchParams(window.location.search);
      
      const token = hashParams.get('access_token') || searchParams.get('access_token');
      
      if (token) {
        fetch('https://discord.com/api/users/@me', {
          headers: { 'Authorization': 'Bearer ' + token }
        })
        .then(function(res) { return res.json(); })
        .then(function(user) {
          if (user && user.id) {
            const avatarUrl = user.avatar
              ? 'https://cdn.discordapp.com/avatars/' + user.id + '/' + user.avatar + '.png'
              : 'https://cdn.discordapp.com/embed/avatars/0.png';
            
            const payload = {
              id: user.id,
              username: user.username,
              displayName: user.global_name || user.username,
              avatar: avatarUrl,
              role: 'Ciudadano',
              discriminator: user.discriminator || '0',
              isStaff: false
            };
            
            try {
              localStorage.setItem('perp_discord_user', JSON.stringify(payload));
            } catch(e) {}
            
            if (window.opener && window.opener !== window) {
              window.opener.postMessage({ type: 'DISCORD_OAUTH_SUCCESS', user: payload }, '*');
              window.close();
            } else {
              // Redirect back to root of site
              const rootUrl = window.location.origin + window.location.pathname.replace(/\/api\/auth\/callback\/discord.*/, '') + '/';
              window.location.href = rootUrl;
            }
          }
        })
        .catch(function(err) {
          document.body.innerHTML = '<p style="color:#ef4444;">Error al conectar con Discord. Cierra esta ventana e intenta de nuevo.</p>';
        });
      } else {
        const err = searchParams.get('error') || hashParams.get('error');
        if (err && window.opener) {
          window.opener.postMessage({ type: 'DISCORD_OAUTH_ERROR', error: err }, '*');
        }
      }
    })();
  </script>
</body>
</html>
